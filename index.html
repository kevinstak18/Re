<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f6f8fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Text Reader">

<title>Text Reader</title>

<style>
:root {
  --bg:#f6f8fc;
  --card:#fff;
  --text:#1f1f1f;
  --subtext:#5f6368;
  --primary:#1a73e8;
  --primary-hover:#1765cc;
  --danger:#ea4335;
  --success:#34a853;
  --warning:#fbbc04;
  --border:#e0e3e7;
  --input-bg:#f1f3f4;
  --shadow:0 1px 3px rgba(60,64,67,.15),0 4px 12px rgba(60,64,67,.08);
  --slider-track:#dadce0;
  --radius:16px;
  --radius-sm:12px;
}

body.dark {
  --bg:#202124;
  --card:#292a2d;
  --text:#e8eaed;
  --subtext:#9aa0a6;
  --primary:#8ab4f8;
  --primary-hover:#aecbfa;
  --danger:#f28b82;
  --success:#81c995;
  --warning:#fdd663;
  --border:#3c4043;
  --input-bg:#35363a;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
  --slider-track:#5f6368;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html {
  -webkit-text-size-adjust:100%;
}

body {
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:32px 16px calc(32px + env(safe-area-inset-bottom));
  padding-top:calc(32px + env(safe-area-inset-top));
  transition:background .3s,color .3s;
  overflow-x:hidden;
}

body.lang-en {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
  "Helvetica Neue",Arial,sans-serif;
}

body.lang-fa {
  font-family:Tahoma,"Segoe UI",-apple-system,"Iranian Sans",
  "Vazirmatn",Arial,sans-serif;
  direction:rtl;
  text-align:right;
}

body.lang-en {
  direction:ltr;
  text-align:left;
}

.container {
  width:100%;
  max-width:640px;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:12px;
}

.header h1 {
  font-size:clamp(19px,5vw,22px);
  font-weight:600;
  letter-spacing:.2px;
  flex:1;
}

.header-controls {
  display:flex;
  gap:8px;
  align-items:center;
}

.icon-btn {
  background:var(--input-bg);
  border:none;
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s,transform .2s;
  color:var(--text);
  font-size:14px;
  font-weight:600;
}

.icon-btn:hover {
  transform:rotate(20deg);
}

#helpBtn:hover {
  transform:scale(1.1);
}

.icon-btn:active {
  transform:scale(.92);
}

.icon-btn svg {
  width:20px;
  height:20px;
}

.lang-btn {
  background:var(--input-bg);
  border:none;
  height:44px;
  padding:0 16px;
  flex-shrink:0;
  border-radius:22px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--text);
  font-size:14px;
  font-weight:600;
  transition:background .2s,transform .1s;
  font-family:inherit;
}

.lang-btn:hover {
  background:var(--border);
}

.lang-btn:active {
  transform:scale(.95);
}

.lang-btn .flag {
  font-size:16px;
}

.card {
  background:var(--card);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
  transition:background .3s,box-shadow .3s;
}

.test-screen {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  padding:40px 16px;
  text-align:center;
}

.test-screen.hidden {
  display:none;
}

.spinner {
  width:44px;
  height:44px;
  border:4px solid var(--input-bg);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform:rotate(360deg);
  }
}

.test-screen .msg {
  font-size:15px;
  color:var(--subtext);
  line-height:1.7;
  max-width:420px;
}

.test-icon {
  font-size:44px;
  line-height:1;
}

.main-ui {
  display:none;
}

.main-ui.active {
  display:block;
  animation:fadeIn .4s ease;
}

@keyframes fadeIn {
  from {
    opacity:0;
    transform:translateY(8px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}

.textarea-wrapper {
  position:relative;
}

textarea {
  width:100%;
  min-height:150px;
  padding:14px 16px 30px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--input-bg);
  color:var(--text);
  font-size:16px;
  line-height:1.6;
  resize:vertical;
  outline:none;
  transition:border-color .2s,background .3s,color .3s;
  -webkit-appearance:none;
  font-family:inherit;
  display:block;
}

textarea:focus {
  border-color:var(--primary);
}

textarea::placeholder {
  color:var(--subtext);
}

.resize-handle {
  position:absolute;
  bottom:4px;
  right:6px;
  width:22px;
  height:22px;
  cursor:ns-resize;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--subtext);
  opacity:.55;
  border-radius:6px;
  touch-action:none;
  user-select:none;
  z-index:2;
}

body.lang-fa .resize-handle {
  right:auto;
  left:6px;
}

.resize-handle svg {
  width:14px;
  height:14px;
}

.voice-select,
.option-item {
  margin-top:14px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.voice-select label,
.option-item label {
  font-size:13px;
  color:var(--subtext);
  font-weight:500;
}

select {
  width:100%;
  padding:12px 40px 12px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background-color:var(--input-bg);
  color:var(--text);
  font-size:15px;
  outline:none;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235f6368'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
  background-repeat:no-repeat;
  background-position:right 12px center;
  background-size:20px;
  text-overflow:ellipsis;
  font-family:inherit;
  direction:ltr;
  text-align:left;
}

body.dark select {
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239aa0a6'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
}

select:focus {
  border-color:var(--primary);
}

.options-row {
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.actions {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:16px;
}

button.btn {
  padding:13px 12px;
  border:none;
  border-radius:24px;
  font-size:15px;
  font-weight:500;
  cursor:pointer;
  transition:background .2s,transform .1s,opacity .2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:48px;
  white-space:nowrap;
  font-family:inherit;
}

button.btn:active {
  transform:scale(.96);
}

.btn-primary {
  background:var(--primary);
  color:#fff;
}

body.dark .btn-primary {
  color:#202124;
}

.btn-primary:hover {
  background:var(--primary-hover);
}

.btn-outline {
  background:transparent;
  color:var(--text);
  border:1px solid var(--border) !important;
}

.btn-outline:hover {
  background:var(--input-bg);
}

.btn-test {
  background:var(--success);
  color:#fff;
}

.btn-test:hover {
  opacity:.9;
}

.btn:disabled {
  opacity:.5;
  cursor:not-allowed;
}

.controls {
  margin-top:20px;
  display:none;
  flex-direction:column;
  gap:14px;
}

.controls.active {
  display:flex;
}

.control-row {
  display:grid;
  grid-template-columns:90px 1fr 50px;
  align-items:center;
  gap:12px;
}

.control-row label {
  font-size:13px;
  color:var(--subtext);
}

.control-row output {
  font-size:13px;
  color:var(--text);
  text-align:right;
  font-variant-numeric:tabular-nums;
  font-weight:500;
}

body.lang-fa .control-row output {
  text-align:left;
}

input[type="range"] {
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:24px;
  background:transparent;
  outline:none;
  cursor:pointer;
  margin:0;
}

input[type="range"]::-webkit-slider-runnable-track {
  height:4px;
  border-radius:2px;
  background:var(--slider-track);
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--primary);
  cursor:pointer;
  margin-top:-7px;
}

input[type="range"]::-moz-range-track {
  height:4px;
  border-radius:2px;
  background:var(--slider-track);
}

input[type="range"]::-moz-range-thumb {
  width:18px;
  height:18px;
  border:none;
  border-radius:50%;
  background:var(--primary);
  cursor:pointer;
}

.status {
  margin-top:14px;
  font-size:13px;
  color:var(--subtext);
  text-align:center;
  min-height:18px;
  line-height:1.6;
}

.status.error {
  color:var(--danger);
}

.status.ok {
  color:var(--success);
}

.status.warn {
  color:var(--warning);
}

.icon {
  width:18px;
  height:18px;
  flex-shrink:0;
}

/* Modal */

.modal-overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
  backdrop-filter:blur(4px);
}

.modal-overlay.active {
  display:flex;
}

.modal-box {
  background:var(--card);
  color:var(--text);
  border-radius:var(--radius);
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  width:100%;
  max-width:520px;
  max-height:85vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.modal-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 20px;
  border-bottom:1px solid var(--border);
}

.modal-header h2 {
  font-size:17px;
}

.modal-close {
  background:transparent;
  border:none;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
  color:var(--subtext);
}

.modal-body {
  padding:20px;
  overflow-y:auto;
  line-height:1.7;
  font-size:14px;
}

.modal-body h3 {
  font-size:15px;
  margin:18px 0 8px;
  color:var(--primary);
}

.modal-body h3:first-child {
  margin-top:0;
}

.modal-body p,
.modal-body li {
  margin:5px 0;
}

.modal-body ul,
.modal-body ol {
  padding-inline-start:20px;
}

@media(max-width:480px) {

  body {
    padding:16px 12px calc(16px + env(safe-area-inset-bottom));
    padding-top:calc(16px + env(safe-area-inset-top));
  }

  .card {
    padding:18px 16px;
    border-radius:14px;
  }

  .header {
    margin-bottom:14px;
    gap:8px;
  }

  .icon-btn {
    width:40px;
    height:40px;
  }

  .lang-btn {
    height:40px;
    padding:0 12px;
    font-size:13px;
  }

  .actions {
    grid-template-columns:1fr 1fr;
  }

  .actions .btn-primary {
    grid-column:1 / -1;
    order:-1;
  }

  .control-row {
    grid-template-columns:78px 1fr 44px;
    gap:8px;
  }

  button.btn {
    min-height:46px;
    font-size:14px;
  }

  .btn span.btn-text {
    display:none;
  }

  .actions .btn-primary span.btn-text {
    display:inline;
  }
}
</style>
</head>

<body class="lang-en">

<div class="container">

  <div class="header">

    <h1 id="appTitle">Text Reader</h1>

    <div class="header-controls">

      <button class="icon-btn"
              id="helpBtn"
              aria-label="Help">
        ?
      </button>

      <button class="lang-btn" id="langBtn">
        <span class="flag" id="langFlag">🇮🇷</span>
        <span id="langLabel">فارسی</span>
      </button>

      <button class="icon-btn"
              id="themeBtn"
              aria-label="Toggle theme">
        <svg id="themeIcon"
             viewBox="0 0 24 24"
             fill="currentColor"></svg>
      </button>

    </div>
  </div>

  <div class="card">

    <div class="test-screen" id="testScreen">

      <div class="spinner" id="testSpinner"></div>

      <div class="test-icon"
           id="testIcon"
           style="display:none">
      </div>

      <div class="msg" id="testMsg"></div>

    </div>

    <div class="main-ui" id="mainUI">

      <div class="textarea-wrapper">

        <textarea
          id="textInput"
          placeholder="Type or paste your text here..."></textarea>

        <div class="resize-handle"
             id="resizeHandle">

          <svg viewBox="0 0 24 24"
               fill="currentColor">

            <path d="M22 22H20V20H22V22ZM22 18H20V16H22V18ZM18 22H16V20H18V22ZM22 14H20V12H22V14ZM18 18H16V16H18V18ZM14 22H12V20H14V22ZM22 10H20V8H22V10ZM18 14H16V12H18V14ZM14 18H12V16H14V18ZM10 22H8V20H10V22Z"/>

          </svg>

        </div>

      </div>

      <!-- ALL DEVICE VOICES -->
      <div class="voice-select">

        <label for="voiceSelect"
               id="voiceLabel">
          🎤 Voice
        </label>

        <select id="voiceSelect"></select>

      </div>

      <div class="options-row">

        <div class="option-item">

          <label for="repeatSelect"
                 id="repeatLabel">
            🔁 Repeat
          </label>

          <select id="repeatSelect">

            <option value="1">Off</option>
            <option value="2">2×</option>
            <option value="3">3×</option>
            <option value="4">4×</option>

          </select>

        </div>

      </div>

      <div class="actions">

        <button class="btn btn-primary"
                id="speakBtn">

          <svg class="icon"
               viewBox="0 0 24 24"
               fill="currentColor">

            <path d="M8 5v14l11-7z"/>

          </svg>

          <span class="btn-text"
                id="startLabel">
            Start
          </span>

        </button>

        <button class="btn btn-test"
                id="testBtn">

          <svg class="icon"
               viewBox="0 0 24 24"
               fill="currentColor">

            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>

          </svg>

          <span class="btn-text"
                id="testLabel">
            Test
          </span>

        </button>

        <button class="btn btn-outline"
                id="stopBtn"
                disabled>

          <svg class="icon"
               viewBox="0 0 24 24"
               fill="currentColor">

            <path d="M6 6h12v12H6z"/>

          </svg>

          <span class="btn-text"
                id="stopLabel">
            Stop
          </span>

        </button>

      </div>

      <div class="controls" id="controls">

        <div class="control-row">

          <label for="volume"
                 id="volumeLabel">
            🔊 Volume
          </label>

          <input type="range"
                 id="volume"
                 min="0"
                 max="1"
                 step="0.05"
                 value="1">

          <output id="volumeVal">
            100%
          </output>

        </div>

        <div class="control-row">

          <label for="rate"
                 id="rateLabel">
            ⚡ Speed
          </label>

          <input type="range"
                 id="rate"
                 min=".5"
                 max="2"
                 step=".1"
                 value="1">

          <output id="rateVal">
            1.0x
          </output>

        </div>

        <div class="control-row">

          <label for="pitch"
                 id="pitchLabel">
            🎵 Pitch
          </label>

          <input type="range"
                 id="pitch"
                 min="0"
                 max="2"
                 step=".1"
                 value="1">

          <output id="pitchVal">
            1.0
          </output>

        </div>

      </div>

      <div class="status"
           id="status">
      </div>

    </div>

  </div>

</div>


<!-- HELP -->

<div class="modal-overlay"
     id="helpModal">

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="helpTitle">
        📖 Help
      </h2>

      <button class="modal-close"
              id="helpClose">
        ×
      </button>

    </div>

    <div class="modal-body"
         id="helpBody">
    </div>

  </div>

</div>


<script>

/* =========================================================
   BASIC
========================================================= */

const $ = id => document.getElementById(id);

const testScreen = $("testScreen");
const testSpinner = $("testSpinner");
const testIcon = $("testIcon");
const testMsg = $("testMsg");

const mainUI = $("mainUI");

const textInput = $("textInput");

const speakBtn = $("speakBtn");
const testBtn = $("testBtn");
const stopBtn = $("stopBtn");

const controls = $("controls");

const volume = $("volume");
const rate = $("rate");
const pitch = $("pitch");

const volumeVal = $("volumeVal");
const rateVal = $("rateVal");
const pitchVal = $("pitchVal");

const statusEl = $("status");

const voiceSelect = $("voiceSelect");
const repeatSelect = $("repeatSelect");

const langBtn = $("langBtn");
const langFlag = $("langFlag");
const langLabel = $("langLabel");

const themeBtn = $("themeBtn");
const themeIcon = $("themeIcon");

const helpBtn = $("helpBtn");
const helpModal = $("helpModal");
const helpClose = $("helpClose");
const helpTitle = $("helpTitle");
const helpBody = $("helpBody");

const resizeHandle = $("resizeHandle");


/* =========================================================
   LANGUAGE UI
========================================================= */

const i18n = {

  en: {
    title:"Text Reader",
    placeholder:"Type or paste your text here...",
    voice:"🎤 Voice",
    repeat:"🔁 Repeat",
    repeatOff:"Off",
    repeatTimes:n => `${n}×`,
    start:"Start",
    test:"Test",
    stop:"Stop",
    volume:"🔊 Volume",
    speed:"⚡ Speed",
    pitch:"🎵 Pitch",

    loadingVoices:"Detecting voices installed on your device...",

    voicesFound:n =>
      `${n} voice${n !== 1 ? "s" : ""} found!`,

    ready:n =>
      `✓ Ready — ${n} voice${n !== 1 ? "s" : ""} available`,

    noVoices:
      "⚠ No voices available",

    noSupport:
      "❌ Your browser does not support speech synthesis.",

    selected:(lang,name) =>
      `✓ Selected: ${lang} — ${name}`,

    reading:"🔊 Reading...",

    readingRepeat:n =>
      `🔊 Reading (${n}× repeat)...`,

    finished:"✓ Finished reading",

    stopped:"⏹ Stopped",

    playingTest:"🔉 Playing test...",

    emptyText:"⚠ Please enter some text",

    switchTo:"فارسی",
    switchFlag:"🇮🇷",

    helpTitle:"📖 Help"
  },

  fa: {
    title:"خواننده متن",
    placeholder:"متن خود را اینجا بنویسید یا بچسبانید...",
    voice:"🎤 صدا",
    repeat:"🔁 تکرار",
    repeatOff:"خاموش",
    repeatTimes:n => `${n} بار`,
    start:"شروع",
    test:"تست",
    stop:"توقف",
    volume:"🔊 صدا",
    speed:"⚡ سرعت",
    pitch:"🎵 زیر و بمی",

    loadingVoices:
      "در حال شناسایی صداهای نصب‌شده روی دستگاه...",

    voicesFound:n =>
      `${n} صدای نصب‌شده پیدا شد!`,

    ready:n =>
      `✓ آماده — ${n} صدا در دسترس است`,

    noVoices:
      "⚠ هیچ صدایی در دسترس نیست",

    noSupport:
      "❌ مرورگر شما از تبدیل متن به گفتار پشتیبانی نمی‌کند.",

    selected:(lang,name) =>
      `✓ انتخاب شد: ${lang} — ${name}`,

    reading:"🔊 در حال خواندن...",

    readingRepeat:n =>
      `🔊 در حال خواندن (${n} بار تکرار)...`,

    finished:"✓ خواندن تمام شد",

    stopped:"⏹ متوقف شد",

    playingTest:"🔉 در حال پخش تست...",

    emptyText:"⚠ لطفاً متنی وارد کنید",

    switchTo:"English",
    switchFlag:"🇺🇸",

    helpTitle:"📖 راهنما"
  }

};

let currentLang =
  localStorage.getItem("lang") || "en";

let t = i18n[currentLang];


/* =========================================================
   APPLY LANGUAGE
========================================================= */

function applyLanguage(lang) {

  currentLang = lang;
  t = i18n[lang];

  localStorage.setItem("lang",lang);

  document.body.classList.remove(
    "lang-en",
    "lang-fa"
  );

  document.body.classList.add(
    "lang-" + lang
  );

  document.documentElement.lang =
    lang === "fa" ? "fa" : "en";

  document.documentElement.dir =
    lang === "fa" ? "rtl" : "ltr";

  document.title = t.title;

  $("appTitle").textContent = t.title;

  $("voiceLabel").textContent = t.voice;
  $("repeatLabel").textContent = t.repeat;

  $("startLabel").textContent = t.start;
  $("testLabel").textContent = t.test;
  $("stopLabel").textContent = t.stop;

  $("volumeLabel").textContent = t.volume;
  $("rateLabel").textContent = t.speed;
  $("pitchLabel").textContent = t.pitch;

  textInput.placeholder = t.placeholder;

  repeatSelect.options[0].textContent =
    t.repeatOff;

  repeatSelect.options[1].textContent =
    t.repeatTimes(2);

  repeatSelect.options[2].textContent =
    t.repeatTimes(3);

  repeatSelect.options[3].textContent =
    t.repeatTimes(4);

  langLabel.textContent = t.switchTo;
  langFlag.textContent = t.switchFlag;

  if (helpModal.classList.contains("active")) {
    renderHelp();
  }

  if (mainUI.classList.contains("active")) {
    buildVoiceList();
  }
}

/* =========================================================
   SPEECH ENGINE
========================================================= */

if (!("speechSynthesis" in window)) {

  testSpinner.style.display = "none";

  testIcon.style.display = "block";

  testIcon.textContent = "❌";

  testMsg.textContent = t.noSupport;

} else {

  const synth = window.speechSynthesis;

  let voices = [];

  let queue = [];

  let currentIndex = 0;

  let currentRepeatIndex = 0;

  let stopRequested = false;

  let activeTimeout = null;

  let isSpeaking = false;


  /* =======================================================
     LANGUAGE DISPLAY
  ======================================================= */

  const languageNames = {

    "fa":"🇮🇷 فارسی",

    "fa-ir":"🇮🇷 فارسی (ایران)",

    "en":"🇺🇸 English",

    "en-us":"🇺🇸 English (US)",

    "en-gb":"🇬🇧 English (UK)",

    "en-au":"🇦🇺 English (Australia)",

    "en-ca":"🇨🇦 English (Canada)",

    "en-in":"🇮🇳 English (India)",

    "ar":"🌐 العربية",

    "ar-sa":"🇸🇦 العربية (السعودية)",

    "tr":"🇹🇷 Türkçe",

    "tr-tr":"🇹🇷 Türkçe (Türkiye)",

    "az":"🇦🇿 Azərbaycan dili",

    "az-az":"🇦🇿 Azərbaycan dili",

    "ru":"🇷🇺 Русский",

    "ru-ru":"🇷🇺 Русский",

    "de":"🇩🇪 Deutsch",

    "de-de":"🇩🇪 Deutsch",

    "fr":"🇫🇷 Français",

    "fr-fr":"🇫🇷 Français",

    "es":"🇪🇸 Español",

    "es-es":"🇪🇸 Español",

    "it":"🇮🇹 Italiano",

    "it-it":"🇮🇹 Italiano",

    "pt":"🌐 Português",

    "pt-br":"🇧🇷 Português (Brasil)",

    "zh":"🌐 中文",

    "zh-cn":"🇨🇳 中文 (简体)",

    "zh-tw":"🇹🇼 中文 (繁體)",

    "ja":"🇯🇵 日本語",

    "ja-jp":"🇯🇵 日本語",

    "ko":"🇰🇷 한국어",

    "ko-kr":"🇰🇷 한국어",

    "hi":"🇮🇳 हिन्दी",

    "hi-in":"🇮🇳 हिन्दी"
  };


  function normalizeLang(lang) {

    return String(lang || "")
      .trim()
      .toLowerCase()
      .replace("_","-");

  }


  /*
   * این تابع هیچ زبان ناشناخته‌ای را حذف نمی‌کند.
   *
   * اگر مثلاً گوشی زبان جدیدی مثل:
   *
   * pl-PL
   * nl-NL
   * sv-SE
   *
   * ارائه کند، آن هم وارد لیست می‌شود.
   */

  function getLanguageLabel(lang) {

    const normalized =
      normalizeLang(lang);

    if (languageNames[normalized]) {
      return languageNames[normalized];
    }

    const base =
      normalized.split("-")[0];

    if (languageNames[base]) {
      return languageNames[base];
    }

    /*
     * زبان ناشناخته:
     * مثلاً:
     * pl-PL → 🌐 PL (PL)
     */

    if (normalized.includes("-")) {

      const parts =
        normalized.split("-");

      return `🌐 ${parts[0].toUpperCase()} (${parts[1].toUpperCase()})`;
    }

    return `🌐 ${normalized.toUpperCase()}`;
  }


  /* =======================================================
     GET ALL DEVICE VOICES
  ======================================================= */

  function getAllDeviceVoices() {

    const result =
      synth.getVoices() || [];

    /*
     * حذف Voiceهای تکراری
     */

    const unique = [];

    const seen = new Set();

    for (const voice of result) {

      if (!voice) continue;

      const key =
        voice.voiceURI ||
        `${voice.lang}|${voice.name}`;

      if (seen.has(key)) continue;

      seen.add(key);

      unique.push(voice);
    }

    return unique;
  }


  /* =======================================================
     SORT VOICES
  ======================================================= */

  function sortVoices(list) {

    return list.sort((a,b) => {

      const la =
        normalizeLang(a.lang);

      const lb =
        normalizeLang(b.lang);

      /*
       * اول فارسی ایران
       */

      if (la === "fa-ir" && lb !== "fa-ir")
        return -1;

      if (lb === "fa-ir" && la !== "fa-ir")
        return 1;

      /*
       * بعد سایر فارسی‌ها
       */

      const faA =
        la.startsWith("fa");

      const faB =
        lb.startsWith("fa");

      if (faA && !faB)
        return -1;

      if (faB && !faA)
        return 1;

      /*
       * بعد انگلیسی
       */

      const enA =
        la.startsWith("en");

      const enB =
        lb.startsWith("en");

      if (enA && !enB)
        return -1;

      if (enB && !enA)
        return 1;

      /*
       * بقیه زبان‌ها بر اساس نام زبان
       */

      const nameA =
        getLanguageLabel(a.lang) +
        " " +
        a.name;

      const nameB =
        getLanguageLabel(b.lang) +
        " " +
        b.name;

      return nameA.localeCompare(
        nameB,
        undefined,
        {
          sensitivity:"base"
        }
      );

    });

  }


  /* =======================================================
     BUILD VOICE LIST
  ======================================================= */

  function buildVoiceList() {

    voices =
      getAllDeviceVoices();

    const previous =
      localStorage.getItem("voiceURI");

    voiceSelect.innerHTML = "";

    if (!voices.length) {

      const option =
        document.createElement("option");

      option.textContent = "—";

      voiceSelect.appendChild(option);

      speakBtn.disabled = true;

      setStatus(
        t.noVoices,
        "error"
      );

      return;
    }

    sortVoices(voices);

    voices.forEach(voice => {

      const option =
        document.createElement("option");

      option.value =
        voice.voiceURI;

      let label =
        `${getLanguageLabel(voice.lang)} — ${voice.name}`;

      if (voice.default) {
        label += " ⭐";
      }

      option.textContent = label;

      if (
        previous &&
        voice.voiceURI === previous
      ) {
        option.selected = true;
      }

      voiceSelect.appendChild(option);

    });


    /*
     * اگر Voice قبلی پیدا نشد
     */

    if (!voiceSelect.value) {

      /*
       * اولویت با فارسی ایران
       */

      const faIR =
        voices.find(v =>
          normalizeLang(v.lang) === "fa-ir"
        );

      /*
       * سپس انگلیسی US
       */

      const enUS =
        voices.find(v =>
          normalizeLang(v.lang) === "en-us"
        );

      const selected =
        faIR ||
        enUS ||
        voices.find(v => v.default) ||
        voices[0];

      if (selected) {

        voiceSelect.value =
          selected.voiceURI;

        localStorage.setItem(
          "voiceURI",
          selected.voiceURI
        );
      }
    }


    speakBtn.disabled = false;

    /*
     * شمارش زبان‌های مختلف
     */

    const languages =
      new Set(
        voices.map(v =>
          normalizeLang(v.lang)
        )
      );

    setStatus(
      t.ready(
        `${voices.length} / ${languages.size}`
      ),
      "ok"
    );

  }


  /* =======================================================
     STATUS
  ======================================================= */

  function setStatus(
    message,
    type = ""
  ) {

    statusEl.textContent = message;

    statusEl.className =
      "status" +
      (type ? " " + type : "");

  }


  /* =======================================================
     INITIAL VOICE DETECTION
  ======================================================= */

  function detectVoices() {

    testMsg.textContent =
      t.loadingVoices;

    let attempts = 0;

    const maxAttempts = 30;

    function check() {

      attempts++;

      voices =
        getAllDeviceVoices();

      if (voices.length > 0) {

        showTestSuccess(
          voices.length
        );

        return;
      }

      if (attempts >= maxAttempts) {

        showTestError();

        return;
      }

      setTimeout(
        check,
        250
      );
    }

    check();

  }


  function showTestSuccess(count) {

    testSpinner.style.display =
      "none";

    testIcon.style.display =
      "block";

    testIcon.textContent =
      "✅";

    testMsg.innerHTML = `
      <b style="color:var(--success)">
        ${t.voicesFound(count)}
      </b>
      <br>
      <span style="font-size:13px">
        ${currentLang === "fa"
          ? "در حال آماده‌سازی برنامه..."
          : "Preparing the application..."}
      </span>
    `;

    setTimeout(() => {

      testScreen.classList.add(
        "hidden"
      );

      mainUI.classList.add(
        "active"
      );

      buildVoiceList();

    },600);

  }


  function showTestError() {

    testSpinner.style.display =
      "none";

    testIcon.style.display =
      "block";

    testIcon.textContent =
      "⚠️";

    testMsg.innerHTML = `
      <b style="color:var(--warning)">
        ${t.noVoices}
      </b>
      <br><br>
      <span style="font-size:13px">
        ${
          currentLang === "fa"
            ? "لطفاً موتور تبدیل متن به گفتار و Voiceهای دستگاه را بررسی کنید."
            : "Please check your device text-to-speech engine and installed voices."
        }
      </span>
    `;

  }


  /* =======================================================
     VOICE CHANGED
  ======================================================= */

  /*
   * وقتی کاربر Voice جدیدی نصب کند
   * یا موتور TTS لیست را تغییر دهد،
   * لیست برنامه هم خودکار به‌روزرسانی می‌شود.
   */

  if ("onvoiceschanged" in synth) {

    synth.onvoiceschanged =
      function() {

        if (
          mainUI.classList.contains(
            "active"
          )
        ) {

          const current =
            voiceSelect.value;

          buildVoiceList();

          /*
           * تلاش برای حفظ انتخاب قبلی
           */

          if (current) {

            const exists =
              voices.some(
                v =>
                  v.voiceURI === current
              );

            if (exists) {

              voiceSelect.value =
                current;
            }
          }

        }

      };

  }


  /*
   * روش استاندارد EventTarget
   */

  if (
    typeof synth.addEventListener ===
    "function"
  ) {

    synth.addEventListener(
      "voiceschanged",
      () => {

        if (
          mainUI.classList.contains(
            "active"
          )
        ) {
          buildVoiceList();
        }

      }
    );

  }


  /* =======================================================
     SELECTED VOICE
  ======================================================= */

  function getSelectedVoice() {

    const uri =
      voiceSelect.value;

    if (!uri) return null;

    return voices.find(
      voice =>
        voice.voiceURI === uri
    ) || null;

  }


  voiceSelect.addEventListener(
    "change",
    () => {

      const voice =
        getSelectedVoice();

      if (!voice) return;

      localStorage.setItem(
        "voiceURI",
        voice.voiceURI
      );

      setStatus(
        t.selected(
          getLanguageLabel(
            voice.lang
          ),
          voice.name
        ),
        "ok"
      );

      if (isSpeaking) {

        stop();

        setTimeout(
          speak,
          150
        );

      }

    }
  );


  /* =======================================================
     TEXT TOKENIZER
  ======================================================= */

  const MS_PER_DOT = 300;

  const MAX_PAUSE_MS = 10000;

  const MAX_DOTS =
    Math.floor(
      MAX_PAUSE_MS /
      MS_PER_DOT
    );


  function tokenizeText(text) {

    const normalized =
      text
        .replace(/\s+/g," ")
        .trim();

    const tokens = [];

    let buffer = "";

    let i = 0;

    while (
      i < normalized.length
    ) {

      const ch =
        normalized[i];

      if (ch === ".") {

        let dotCount = 0;

        let j = i;

        while (
          j < normalized.length &&
          (
            normalized[j] === "." ||
            normalized[j] === " "
          )
        ) {

          if (
            normalized[j] === "."
          ) {
            dotCount++;
          }

          j++;

        }

        const hasWordAfter =
          j < normalized.length &&
          /\S/.test(
            normalized[j]
          );

        const hasTextBefore =
          buffer.trim().length > 0;

        if (
          hasWordAfter &&
          hasTextBefore &&
          dotCount > 0
        ) {

          tokens.push({
            type:"text",
            value:buffer.trim()
          });

          buffer = "";

          const cappedDots =
            Math.min(
              dotCount,
              MAX_DOTS
            );

          const pauseMs =
            Math.min(
              MS_PER_DOT *
              cappedDots,
              MAX_PAUSE_MS
            );

          tokens.push({
            type:"pause",
            ms:pauseMs,
            dots:cappedDots
          });

          i = j;

          continue;
        }

        buffer += ".";

        i++;

        continue;

      }

      buffer += ch;

      i++;

    }

    if (buffer.trim()) {

      tokens.push({
        type:"text",
        value:buffer.trim()
      });

    }

    return tokens;

  }


  function buildChunks(
    tokens,
    repeatCount
  ) {

    const chunks = [];

    let currentText = "";

    let pendingPause = 0;

    const flush = () => {

      if (
        currentText.trim()
      ) {

        chunks.push({
          type:"speak",
          text:currentText.trim(),
          repeat:repeatCount,
          pauseAfter:pendingPause
        });

      }

      currentText = "";

      pendingPause = 0;

    };


    for (const token of tokens) {

      if (
        token.type === "pause"
      ) {

        if (
          currentText.trim()
        ) {

          currentText =
            currentText.trim();

          pendingPause +=
            token.ms;

          flush();

        }

      } else {

        if (
          (
            currentText +
            " " +
            token.value
          ).length > 180 &&
          currentText.trim()
        ) {

          flush();

        }

        currentText +=
          (
            currentText
              ? " "
              : ""
          ) +
          token.value;

      }

    }

    flush();

    return chunks;

  }


  function splitText(
    text,
    repeatCount
  ) {

    return buildChunks(
      tokenizeText(text),
      repeatCount
    );

  }


  /* =======================================================
     CONTROLS
  ======================================================= */

  function updateControls() {

    volumeVal.textContent =
      Math.round(
        volume.value * 100
      ) + "%";

    rateVal.textContent =
      parseFloat(
        rate.value
      ).toFixed(1) + "x";

    pitchVal.textContent =
      parseFloat(
        pitch.value
      ).toFixed(1);

  }

  volume.addEventListener(
    "input",
    updateControls
  );

  rate.addEventListener(
    "input",
    updateControls
  );

  pitch.addEventListener(
    "input",
    updateControls
  );


  /* =======================================================
     SPEAK
  ======================================================= */

  function clearTimeoutSafe() {

    if (activeTimeout) {

      clearTimeout(
        activeTimeout
      );

      activeTimeout = null;

    }

  }


  function speakNext() {

    if (stopRequested)
      return;

    if (
      currentIndex >=
      queue.length
    ) {

      finishSpeaking();

      return;
    }

    const chunk =
      queue[currentIndex];

    if (
      chunk.type === "pause"
    ) {

      activeTimeout =
        setTimeout(
          () => {

            currentIndex++;

            speakNext();

          },
          chunk.pauseAfter
        );

      return;
    }


    const totalRepeats =
      chunk.repeat || 1;

    const utterance =
      new SpeechSynthesisUtterance(
        chunk.text
      );

    const voice =
      getSelectedVoice();

    if (voice) {

      utterance.voice =
        voice;

      utterance.lang =
        voice.lang;

    }


    utterance.volume =
      parseFloat(
        volume.value
      );

    utterance.rate =
      parseFloat(
        rate.value
      );

    utterance.pitch =
      parseFloat(
        pitch.value
      );


    utterance.onend = () => {

      if (stopRequested)
        return;

      currentRepeatIndex++;

      if (
        currentRepeatIndex <
        totalRepeats
      ) {

        activeTimeout =
          setTimeout(
            () => {

              if (!stopRequested) {

                synth.speak(
                  createRepeatUtterance(
                    chunk.text
                  )
                );

              }

            },
            120
          );

        return;

      }


      currentRepeatIndex = 0;

      currentIndex++;

      if (
        chunk.pauseAfter > 0
      ) {

        activeTimeout =
          setTimeout(
            speakNext,
            chunk.pauseAfter
          );

      } else {

        speakNext();

      }

    };


    utterance.onerror =
      () => {

        if (!stopRequested) {

          currentRepeatIndex = 0;

          currentIndex++;

          speakNext();

        }

      };


    synth.speak(
      utterance
    );

  }


  function createRepeatUtterance(
    text
  ) {

    const u =
      new SpeechSynthesisUtterance(
        text
      );

    const voice =
      getSelectedVoice();

    if (voice) {

      u.voice = voice;

      u.lang = voice.lang;

    }

    u.volume =
      parseFloat(volume.value);

    u.rate =
      parseFloat(rate.value);

    u.pitch =
      parseFloat(pitch.value);

    u.onend = () => {

      if (stopRequested)
        return;

      currentRepeatIndex++;

      const chunk =
        queue[currentIndex];

      const total =
        chunk.repeat || 1;

      if (
        currentRepeatIndex <
        total
      ) {

        activeTimeout =
          setTimeout(
            () => {

              synth.speak(
                createRepeatUtterance(
                  chunk.text
                )
              );

            },
            120
          );

      } else {

        currentRepeatIndex = 0;

        currentIndex++;

        if (
          chunk.pauseAfter
        ) {

          activeTimeout =
            setTimeout(
              speakNext,
              chunk.pauseAfter
            );

        } else {

          speakNext();

        }

      }

    };

    return u;

  }


  function finishSpeaking() {

    isSpeaking = false;

    speakBtn.disabled = false;

    stopBtn.disabled = true;

    currentIndex = 0;

    currentRepeatIndex = 0;

    setStatus(
      t.finished,
      "ok"
    );

  }


  function speak() {

    const text =
      textInput.value.trim();

    if (!text) {

      textInput.focus();

      setStatus(
        t.emptyText,
        "error"
      );

      return;

    }


    synth.cancel();

    clearTimeoutSafe();


    voices =
      getAllDeviceVoices();


    const repeatCount =
      parseInt(
        repeatSelect.value,
        10
      ) || 1;


    queue =
      splitText(
        text,
        repeatCount
      );


    currentIndex = 0;

    currentRepeatIndex = 0;

    stopRequested = false;

    isSpeaking = true;


    speakBtn.disabled = true;

    stopBtn.disabled = false;

    controls.classList.add(
      "active"
    );


    if (repeatCount > 1) {

      setStatus(
        t.readingRepeat(
          repeatCount
        )
      );

    } else {

      setStatus(
        t.reading
      );

    }


    activeTimeout =
      setTimeout(
        speakNext,
        100
      );

  }


  function stop() {

    stopRequested = true;

    clearTimeoutSafe();

    synth.cancel();

    isSpeaking = false;

    currentIndex = 0;

    currentRepeatIndex = 0;

    queue = [];

    speakBtn.disabled = false;

    stopBtn.disabled = true;

    setStatus(
      t.stopped
    );

  }


  speakBtn.addEventListener(
    "click",
    speak
  );

  stopBtn.addEventListener(
    "click",
    stop
  );


  /* =======================================================
     TEST
  ======================================================= */

  testBtn.addEventListener(
    "click",
    () => {

      synth.cancel();

      const voice =
        getSelectedVoice();

      if (!voice) {

        setStatus(
          t.noVoices,
          "error"
        );

        return;

      }


      /*
       * تست با متن مناسب زبان انتخاب‌شده
       */

      let testText =
        "Hello, this is a test of the selected voice.";

      const lang =
        normalizeLang(
          voice.lang
        );

      if (
        lang.startsWith("fa")
      ) {

        testText =
          "سلام، این یک آزمایش برای صدای انتخاب شده است.";

      }


      const utterance =
        new SpeechSynthesisUtterance(
          testText
        );

      utterance.voice =
        voice;

      utterance.lang =
        voice.lang;

      utterance.volume =
        parseFloat(volume.value);

      utterance.rate =
        parseFloat(rate.value);

      utterance.pitch =
        parseFloat(pitch.value);


      synth.speak(
        utterance
      );

      setStatus(
        t.playingTest
      );

    }
  );


  /* =======================================================
     TEXT CHANGE
  ======================================================= */

  textInput.addEventListener(
    "input",
    () => {

      if (isSpeaking) {
        stop();
      }

    }
  );


  /* =======================================================
     RESIZE
  ======================================================= */

  let dragging = false;

  let startY = 0;

  let startHeight = 0;


  function startResize(y) {

    dragging = true;

    startY = y;

    startHeight =
      textInput.offsetHeight;

    document.body.style.userSelect =
      "none";

  }


  function moveResize(y) {

    if (!dragging)
      return;

    const delta =
      y - startY;

    const newHeight =
      Math.max(
        70,
        Math.min(
          startHeight + delta,
          window.innerHeight * .85
        )
      );

    textInput.style.height =
      newHeight + "px";

  }


  function endResize() {

    dragging = false;

    document.body.style.userSelect =
      "";

  }


  resizeHandle.addEventListener(
    "mousedown",
    e => {

      e.preventDefault();

      startResize(
        e.clientY
      );

    }
  );


  window.addEventListener(
    "mousemove",
    e => {

      if (dragging) {
        moveResize(
          e.clientY
        );
      }

    }
  );


  window.addEventListener(
    "mouseup",
    endResize
  );


  resizeHandle.addEventListener(
    "touchstart",
    e => {

      e.preventDefault();

      startResize(
        e.touches[0].clientY
      );

    },
    {passive:false}
  );


  window.addEventListener(
    "touchmove",
    e => {

      if (!dragging)
        return;

      moveResize(
        e.touches[0].clientY
      );

    },
    {passive:true}
  );


  window.addEventListener(
    "touchend",
    endResize
  );


  window.addEventListener(
    "touchcancel",
    endResize
  );


  window.addEventListener(
    "beforeunload",
    () => synth.cancel()
  );


  /* =======================================================
     START
  ======================================================= */

  applyLanguage(
    currentLang
  );

  updateControls();

  detectVoices();

}

</script>

</body>
